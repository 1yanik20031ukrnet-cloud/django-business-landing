{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}BotForge — разработка Telegram-ботов и AI-агентов{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'landing/styles.css' %}?v=4">

    <script src="{% static 'landing/contact-toggle.js' %}" defer></script>

<body id="top">

<header>
    <strong>BotForge</strong>
    <nav>
        <a href="#advantages">Преимущества</a>
        <a href="#services">Услуги</a>
        <a href="#calculator">Калькулятор</a>
        <a href="#steps">Как работаем</a>
        <a href="#reviews">Отзывы</a>
        <a href="#contact">Контакты</a>
    </nav>
</header>

{% block content %}{% endblock %}

<footer>
    <p>BotForge — 2026</p>
</footer>

<a href="#top" class="back-to-top" aria-label="Вернуться наверх">↑</a>

</body>
</html>
